<script>
(function () {
  'use strict';

  const C = CONFIG;

  const log = function () {
    if (C.DEBUG) {
      console.log.apply(
        console,
        ['[tracker]'].concat([].slice.call(arguments))
      );
    }
  };

  const btn = document.getElementById('joinBtn');
  const timerEl = document.getElementById('timer');
  const countdownBox = document.getElementById('countdownBox');

  // ---------------- Apply CONFIG to the page ----------------
  document.title = C.PAGE_TITLE;
  document.getElementById('displayName').textContent = C.DISPLAY_NAME;
  document.getElementById('btnText').textContent = C.BUTTON_TEXT;

  const avatar = document.getElementById('avatar');
  if (C.AVATAR_URL) {
    avatar.src = C.AVATAR_URL;
  }

  if (C.DISCLAIMER_TEXT) {
    const disclaimer = document.getElementById('disclaimer');
    disclaimer.textContent = C.DISCLAIMER_TEXT;
    disclaimer.hidden = false;
  }

  const root = document.documentElement.style;
  root.setProperty('--accent', C.ACCENT_COLOR);
  root.setProperty('--g1', C.BUTTON_GRADIENT[0]);
  root.setProperty('--g2', C.BUTTON_GRADIENT[1]);
  root.setProperty('--g3', C.BUTTON_GRADIENT[2]);

  countdownBox.hidden = !C.COUNTDOWN_REDIRECT;

  // Start with the fallback link; replaced by the tracked invite link
  // as soon as the backend returns one.
  btn.href = C.FALLBACK_TELEGRAM_LINK || '#';

  // ---------------- Helpers ----------------
  const sleep = function (ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  };

  function getCookie(name) {
    const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const match = document.cookie.match(
      new RegExp('(?:^|;\\s*)' + escaped + '=([^;]*)')
    );
    return match ? decodeURIComponent(match[1]) : null;
  }

  // The Pixel sets _fbp shortly after it loads, so wait briefly for it
  async function waitForFbp(maxMs) {
    const start = Date.now();
    while (Date.now() - start < maxMs) {
      const value = getCookie('_fbp');
      if (value) return value;
      await sleep(100);
    }
    return getCookie('_fbp');
  }

  function safeStorage(action, key, value) {
    try {
      if (action === 'get') {
        return sessionStorage.getItem(key);
      }
      sessionStorage.setItem(key, value);
    } catch (error) {
      // Storage may be unavailable.
    }
    return null;
  }

  // ---------------- Tracking ----------------
  let trackDone = false;

  async function trackVisit() {
    let timeoutId;

    try {
      if (!C.CLIENT_ID || !C.BACKEND_URL) {
        console.warn('CLIENT_ID or BACKEND_URL missing, skipping tracking.');
        return;
      }

      // fbclid from the URL (remembered for this tab so a reload keeps it)
      const urlFbclid = new URLSearchParams(
        window.location.search
      ).get('fbclid');

      if (urlFbclid) {
        safeStorage('set', 'tg_fbclid', urlFbclid);
      }

      const fbclid =
        urlFbclid || safeStorage('get', 'tg_fbclid') || null;

      log('fbclid:', fbclid);

      // Reuse the invite link on reload so we don't create extra links
      const cacheKey =
        'tg_invite_' + C.CLIENT_ID + '_' + (fbclid || 'none');

      const cached = safeStorage('get', cacheKey);

      if (cached) {
        btn.href = cached;
        log('Using cached invite link:', cached);
        return;
      }

      const fbp = C.PIXEL_ID
        ? await waitForFbp(C.FBP_WAIT_MS)
        : getCookie('_fbp');

      log('fbp:', fbp);

      const controller = new AbortController();

      timeoutId = setTimeout(function () {
        controller.abort();
      }, C.REQUEST_TIMEOUT_MS);

      const response = await fetch(C.BACKEND_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          client_id: C.CLIENT_ID,
          fbclid: fbclid,
          fbp: fbp,
          event_source_url: window.location.href
        }),
        signal: controller.signal
      });

      const data = await response.json();
      log('Backend response:', data);

      if (data && data.ok && data.invite_link) {
        // Use the unique tracked invite link
        btn.href = data.invite_link;
        safeStorage('set', cacheKey, data.invite_link);
      } else {
        console.warn(
          'Tracking failed, using fallback link:',
          data && data.error
        );
      }

    } catch (error) {
      console.warn(
        'Tracking error, using fallback link:',
        error.message
      );
    } finally {
      if (timeoutId) clearTimeout(timeoutId);
      trackDone = true;
    }
  }

  const trackPromise = trackVisit();

  // ---------------- Redirect + countdown ----------------
  let remaining = Math.max(
    0,
    Math.floor(Number(C.COUNTDOWN_SECONDS) || 60)
  );

  let redirected = false;
  let interval = null;

  // Goes to Telegram, waiting briefly for the tracked link if it isn't ready yet
  async function goToTelegram() {
    if (redirected) return;
    redirected = true;

    if (interval) {
      clearInterval(interval);
      interval = null;
    }

    if (!trackDone) {
      await Promise.race([trackPromise, sleep(C.CLICK_WAIT_MS)]);
    }

    if (btn.getAttribute('href') === '#') {
      console.warn('No Telegram link available. Set FALLBACK_TELEGRAM_LINK in CONFIG.');
      redirected = false;
      return;
    }

    log('Redirecting to:', btn.href);
    window.location.href = btn.href;
  }

  btn.addEventListener('click', function (event) {
    event.preventDefault();
    goToTelegram();
  });

  function pad(number) {
    return String(number).padStart(2, '0');
  }

  function renderTimer() {
    const minutes = Math.floor(remaining / 60);
    const seconds = remaining % 60;
    timerEl.textContent = pad(minutes) + ' : ' + pad(seconds);
  }

  function tick() {
    renderTimer();

    if (remaining <= 0) {
      goToTelegram();
      return;
    }

    remaining--;
  }

  if (C.COUNTDOWN_REDIRECT) {
    tick();
    interval = setInterval(tick, 1000);
  }

  // Illustrative counter only: does not measure actual visitors.
  const countElement = document.getElementById('viewingCount');
  let count = 128;

  setInterval(function () {
    count += Math.floor(Math.random() * 11) - 5;
    count = Math.max(80, Math.min(250, count));

    if (countElement) {
      countElement.textContent = count;
    }
  }, 4000);

  // Example names only: not actual Telegram join events.
  const nameElement = document.getElementById('demoJoinedName');

  const names = [
    'Rohan', 'Rahul', 'Amit', 'Karan', 'Vikash',
    'Aryan', 'Sahil', 'Akash', 'Raj', 'Aditya'
  ];

  setInterval(function () {
    if (!nameElement) return;

    const currentName = nameElement.textContent;
    let nextName = currentName;

    while (names.length > 1 && nextName === currentName) {
      nextName = names[
        Math.floor(Math.random() * names.length)
      ];
    }

    nameElement.textContent = nextName;
  }, 8000);

})();
</script>
